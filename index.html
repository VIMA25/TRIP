<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colombia Trip 2025</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; }
  #map { position: absolute; inset: 0; z-index: 0; }

  #top-shade {
    position: absolute; top: 0; left: 0; right: 0; height: 120px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    z-index: 10; pointer-events: none;
  }
  #bottom-shade {
    position: absolute; bottom: 0; left: 0; right: 0; height: 240px;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    z-index: 10; pointer-events: none;
  }

  #trip-title {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    z-index: 20; text-align: center; white-space: nowrap;
  }
  #trip-title h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.03em; }
  #trip-title p { font-size: 11px; opacity: 0.5; margin-top: 3px; letter-spacing: 0.08em; text-transform: uppercase; }

  #progress {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
    z-index: 20; display: flex; gap: 6px; align-items: center;
  }
  .pdot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.2); transition: all 0.3s; cursor: pointer;
  }
  .pdot.done { background: rgba(255,255,255,0.45); }
  .pdot.active { background: #fff; width: 9px; height: 9px; }
  .pdot:hover { background: rgba(255,255,255,0.7); }

  #card {
    position: absolute; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(16px);
    z-index: 20; width: min(500px, calc(100vw - 32px));
    background: rgba(8,8,8,0.82);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 0.5px solid rgba(255,255,255,0.13);
    border-radius: 16px; padding: 18px 20px;
    opacity: 0; transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
  }
  #card.visible {
    opacity: 1; transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }
  .card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
  #card-dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; }
  #card-name { font-size: 19px; font-weight: 600; flex: 1; }
  #card-dates { font-size: 12px; opacity: 0.45; white-space: nowrap; }
  #card-detail {
    font-size: 13px; opacity: 0.68; line-height: 1.65;
    border-top: 0.5px solid rgba(255,255,255,0.1); padding-top: 11px;
  }
  #card-nights { font-size: 11px; opacity: 0.35; margin-top: 7px; text-transform: uppercase; letter-spacing: 0.06em; }

  #controls {
    position: absolute; bottom: 34px; right: 20px;
    z-index: 20; display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
  }
  .ctrl-btn {
    background: rgba(8,8,8,0.72); border: 0.5px solid rgba(255,255,255,0.15);
    color: #fff; border-radius: 9px; padding: 8px 16px; font-size: 13px;
    cursor: pointer; backdrop-filter: blur(10px);
    transition: background 0.2s; min-width: 90px; text-align: center;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.12); }
  .ctrl-btn:active { transform: scale(0.97); }

  #phase-counter {
    position: absolute; bottom: 34px; left: 20px;
    z-index: 20; font-size: 12px; opacity: 0.35; letter-spacing: 0.05em;
  }

  .leaflet-control-container { display: none; }
  .leaflet-container { background: #0a0a0a; }
</style>
</head>
<body>

<div id="map"></div>
<div id="top-shade"></div>
<div id="bottom-shade"></div>

<div id="trip-title">
  <h1>Colombia &nbsp;·&nbsp; Jul 2 – Aug 6, 2025</h1>
  <p>11 destinations &nbsp;·&nbsp; 35 nights</p>
</div>

<div id="progress"></div>

<div id="card">
  <div class="card-top">
    <div id="card-dot"></div>
    <div id="card-name"></div>
    <div id="card-dates"></div>
  </div>
  <div id="card-detail"></div>
  <div id="card-nights"></div>
</div>

<div id="controls">
  <button class="ctrl-btn" onclick="prevPhase()">← prev</button>
  <button class="ctrl-btn" id="playbtn" onclick="togglePlay()">⏸ pause</button>
  <button class="ctrl-btn" onclick="nextPhase()">next →</button>
</div>

<div id="phase-counter"></div>

<script>
const phases = [
  { name:"Bogotá", dates:"Jul 2–5", nights:"3 nights", color:"#1D9E75",
    lat:4.711, lon:-74.072, zoom:13,
    detail:"La Candelaria · Gold Museum · Monserrate · Usaquén market · Zona Rosa" },
  { name:"Armenia / Eje Cafetero", dates:"Jul 5–8", nights:"3 nights", color:"#2db87e",
    lat:4.533, lon:-75.681, zoom:12,
    detail:"The course · Parque del Café · thermal baths · new coffee experiences" },
  { name:"Cali", dates:"Jul 8–11", nights:"3 nights", color:"#5DCAA5",
    lat:3.451, lon:-76.532, zoom:13,
    detail:"Salsa scene · Centro Histórico · La Ermita · Lago Calima · Dapa cloud forest" },
  { name:"Bahía Málaga", dates:"Jul 11–15", nights:"4 nights", color:"#378ADD",
    lat:3.983, lon:-77.317, zoom:11,
    detail:"Humpback whale watching in peak season · Ladrilleros beach · mangroves · Pacific soul" },
  { name:"San Agustín", dates:"Jul 15–18", nights:"3 nights", color:"#1D9E75",
    lat:1.883, lon:-76.283, zoom:12,
    detail:"UNESCO archaeological park · pre-Columbian statues · Magdalena canyon · highland scenery" },
  { name:"Cartagena", dates:"Jul 18–20", nights:"weekend", color:"#D85A30",
    lat:10.391, lon:-75.479, zoom:14,
    detail:"Walled city · Getsemaní streets · sunset boat trip · Caribbean vibes" },
  { name:"Minca", dates:"Jul 20–23", nights:"3 nights", color:"#e06030",
    lat:11.133, lon:-74.233, zoom:14,
    detail:"Waterfalls · coffee farms · hammocks with mountain views · cool mountain air" },
  { name:"Tayrona Park", dates:"Jul 23–25", nights:"2 nights", color:"#c04820",
    lat:11.317, lon:-73.917, zoom:12,
    detail:"Hike in · Cabo San Juan beach · Pueblito trail · jungle meets Caribbean sea" },
  { name:"Bucaramanga", dates:"Jul 25–28", nights:"3 nights", color:"#639922",
    lat:7.119, lon:-73.123, zoom:13,
    detail:"Home base · rest and recharge · local favourites · city of parks" },
  { name:"San Andrés", dates:"Jul 28–Aug 2", nights:"5 nights", color:"#7F77DD",
    lat:12.544, lon:-81.718, zoom:13,
    detail:"Caribbean island · crystal blue water · diving · snorkelling · total decompression" },
  { name:"Bogotá — departure", dates:"Aug 2–6", nights:"4 nights buffer", color:"#888780",
    lat:4.711, lon:-74.072, zoom:13,
    detail:"Last meals · shopping · Bogotá goodbyes · fly out August 6th" },
];

const map = L.map('map', {
  center: [6.5, -75.5],
  zoom: 6,
  zoomControl: false,
  attributionControl: false,
  scrollWheelZoom: false,
  dragging: false,
  doubleClickZoom: false,
  keyboard: false,
  touchZoom: false,
});

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
}).addTo(map);

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, opacity: 0.9,
}).addTo(map);

let markers = [];
let routeLine = null;
let currentPhase = 0;
let isPlaying = true;
let phaseTimer = null;

function makeIcon(color, active) {
  const outer = active ? `<circle cx="20" cy="20" r="17" fill="${color}28" stroke="${color}88" stroke-width="1.5"/>` : '';
  const mid   = active ? `<circle cx="20" cy="20" r="12" fill="${color}55"/>` : '';
  const inner = `<circle cx="20" cy="20" r="${active ? 7 : 5}" fill="${color}" stroke="white" stroke-width="2.5"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">${outer}${mid}${inner}</svg>`;
  return L.divIcon({ html: svg, className: '', iconSize:[40,40], iconAnchor:[20,20] });
}

function buildProgress() {
  const bar = document.getElementById('progress');
  bar.innerHTML = '';
  phases.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'pdot' + (i < currentPhase ? ' done' : i === currentPhase ? ' active' : '');
    d.title = p.name;
    d.onclick = () => {
      isPlaying = false;
      document.getElementById('playbtn').textContent = '▶ play';
      clearTimeout(phaseTimer);
      goToPhase(i);
    };
    bar.appendChild(d);
  });
  document.getElementById('phase-counter').textContent = (currentPhase + 1) + ' / ' + phases.length;
}

function updateMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  phases.forEach((ph, i) => {
    if (i > currentPhase) return;
    const m = L.marker([ph.lat, ph.lon], {
      icon: makeIcon(ph.color, i === currentPhase),
      zIndexOffset: i === currentPhase ? 1000 : 0,
    }).addTo(map);
    markers.push(m);
  });
}

function updateRoute() {
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  if (currentPhase < 1) return;
  const coords = phases.slice(0, currentPhase + 1).map(p => [p.lat, p.lon]);
  routeLine = L.polyline(coords, {
    color: 'rgba(255,255,255,0.5)', weight: 2.5, dashArray: '5 8',
  }).addTo(map);
}

function showCard() {
  const ph = phases[currentPhase];
  document.getElementById('card-dot').style.background = ph.color;
  document.getElementById('card-name').textContent = ph.name;
  document.getElementById('card-dates').textContent = ph.dates;
  document.getElementById('card-detail').textContent = ph.detail;
  document.getElementById('card-nights').textContent = ph.nights;
  document.getElementById('card').classList.add('visible');
}

function hideCard() {
  document.getElementById('card').classList.remove('visible');
}

function goToPhase(idx) {
  clearTimeout(phaseTimer);
  currentPhase = Math.max(0, Math.min(idx, phases.length - 1));
  const ph = phases[currentPhase];

  hideCard();
  buildProgress();
  updateMarkers();
  updateRoute();

  map.flyTo([ph.lat, ph.lon], ph.zoom, { duration: 2.4, easeLinearity: 0.2 });

  setTimeout(() => showCard(), 2700);

  if (isPlaying) {
    phaseTimer = setTimeout(() => {
      if (currentPhase < phases.length - 1) {
        goToPhase(currentPhase + 1);
      } else {
        isPlaying = false;
        document.getElementById('playbtn').textContent = '▶ play';
      }
    }, 6500);
  }
}

function togglePlay() {
  isPlaying = !isPlaying;
  document.getElementById('playbtn').textContent = isPlaying ? '⏸ pause' : '▶ play';
  if (isPlaying) {
    clearTimeout(phaseTimer);
    if (currentPhase >= phases.length - 1) currentPhase = 0;
    goToPhase(currentPhase);
  } else {
    clearTimeout(phaseTimer);
  }
}

function nextPhase() {
  isPlaying = false;
  document.getElementById('playbtn').textContent = '▶ play';
  clearTimeout(phaseTimer);
  if (currentPhase < phases.length - 1) goToPhase(currentPhase + 1);
}

function prevPhase() {
  isPlaying = false;
  document.getElementById('playbtn').textContent = '▶ play';
  clearTimeout(phaseTimer);
  if (currentPhase > 0) goToPhase(currentPhase - 1);
}

buildProgress();
setTimeout(() => goToPhase(0), 600);
</script>
</body>
</html>
